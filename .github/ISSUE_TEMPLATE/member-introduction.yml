name: 自己紹介文の掲載・変更申請
description: 自己紹介文の新規掲載、変更、取り下げを申請します
title: "[自己紹介申請] "
body:
  - type: input
    id: discord_name
    attributes:
      label: Discordの表示名
      description: サーバー内で表示されている名前を入力してください
      placeholder: 例）たっけん
    validations:
      required: true
  - type: input
    id: discord_id
    attributes:
      label: DiscordユーザーID（任意）
      description: 同じ表示名のメンバーがいる場合、照合に使います
    validations:
      required: false
  - type: dropdown
    id: request_type
    attributes:
      label: 申請内容
      options:
        - 新しく掲載
        - 自己紹介文を変更
        - 掲載を取り下げ
    validations:
      required: true
  - type: textarea
    id: introduction
    attributes:
      label: 掲載したい自己紹介文
      description: 取り下げの場合は空欄で構いません。管理者確認後に掲載します
      placeholder: 自分の紹介文を入力してください
    validations:
      required: false
